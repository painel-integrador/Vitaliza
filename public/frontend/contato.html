<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entre em Contato</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo-button">
        <a href="/">
          <img alt="Logo-Vitaliza" class="logo" src="/src/images/logo.svg" />
        </a>
        <img
          alt="Menu"
          class="visivel icon"
          id="botao-menu"
          onclick="menu()"
          src="/src/images/menu.svg"
        />
        <img
          alt="Fechar"
          class="invisivel icon"
          id="botao-fechar"
          onclick="menu()"
          src="/src/images/close.svg"
        />
      </div>

      <div id="nav">
        <nav class="menu">
          <a href="/"><p class="item">Início</p></a>
          <a href="/artigos"><p class="item">Artigos</p></a>
          <a href="/calculadoras"><p class="item">Calculadoras</p></a>
          <a href="/sobre"><p class="item">Sobre Nós</p></a>
          <a href="/contato"><p>Entre em Contato</p></a>
          <a href="/home" class="invisivel"><p class="item">Painel</p></a>
          <a href="/perfil" class="invisivel"><p class="item">Perfil</p></a>
          <a onclick="sair()" class="btn-2 invisivel"
            ><p class="item">Sair</p></a
          >
        </nav>

        <div class="grid-horizontal centro-horizontalmente btns" id="btns">
          <a class="btn-2" href="/conta">Criar conta</a>
          <a class="btn-3" href="/conta/login">Fazer Login</a>
        </div>

        <hr class="linha-pontilhada" />

        <p class="txt-detalhe txt-centro">
          © 2026 Vitaliza.inc All rights reserved
        </p>
      </div>
    </header>

    <main>
      <section>
        <h1 class="txt-preto">Entre em Contato</h1>

        <hr class="linha-simples" />

        <p id="resultado" class="txt-centro"></p>

        <form
          onsubmit="enviarMensagem(event)"
          id="formulario"
          class="grid-vertical"
        >
          <div class="grid-horizontal-pc">
            <div class="grid-1">
              <label for="nome">Nome:<span class="txt-vermelho">*</span></label>
              <br />
              <input
                type="text"
                id="nome"
                name="nome"
                required
                class="input-text"
                placeholder="João da Silva..."
              />
            </div>

            <div class="grid-1">
              <label for="email">E-mail:</label>
              <br />
              <input
                type="email"
                id="email"
                name="email"
                class="input-text"
                placeholder="email@exemplo.com..."
              />
            </div>
          </div>

          <!-- Mensagem -->
          <label for="mensagem"
            >Mensagem: <span class="txt-vermelho">*</span></label
          >
          <textarea
            name="mensagem"
            id="mensagem"
            class="input-text"
            placeholder="Minha crítica, elogio, pedido..."
            rows="6"
          ></textarea>

          <p class="txt-detalhe">
            Deixe seu email caso queira receber uma resposta!
          </p>

          <button type="submit" class="btn-3">Enviar</button>
        </form>
      </section>

      <p class="divider">Ou</p>

      <section>
        <p class="txt-centro">
          Pelo email:
          <a href="mailto:vitaliza.pi@gmail.com" class="link"
            >vitaliza.pi@gmail.com</a
          >
        </p>
      </section>
    </main>

    <script src="/src/scripts/header.js" defer></script>
    <script src="/src/scripts/contato.js"></script>
  </body>
</html>
