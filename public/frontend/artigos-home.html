<!doctype html>
<html lang="pt-br">

    <title>Artigos</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo-button">
        <a href="/">
          <img alt="Logo-Vitaliza" class="logo" src="/src/images/logo.svg" />
        </a>
        <img
          alt="Menu"
          class="visivel icon"
          id="botao-menu"
          onclick="menu()"
          src="/src/images/menu.svg"
        />
        <img
          alt="Fechar"
          class="invisivel icon"
          id="botao-fechar"
          onclick="menu()"
          src="/src/images/close.svg"
        />
      </div>

      <div id="nav">
        <nav class="menu">
          <a href="/"><p class="item">Início</p></a>
          <a href="/artigos"><p>Artigos</p></a>
          <a href="/calculadoras"><p class="item">Calculadoras</p></a>
          <a href="/sobre"><p class="item">Sobre Nós</p></a>

          <a href="/home" class="invisivel"><p class="item">Exercícios</p></a>
          <a href="/hidratacao" class="invisivel"
            ><p class="item">Hidratação</p></a
          >
          <a href="/grupo" class="invisivel"><p class="item">Grupo</p></a>
          <a href="/perfil" class="invisivel"><p class="item">Perfil</p></a>
          <a onclick="sair()" class="btn-2 invisivel"
            ><p class="item">Sair</p></a
          >
        </nav>

        <div class="grid-horizontal centro-horizontalmente btns" id="btns">
          <a class="btn-2" href="/conta">Criar conta</a>
          <a class="btn-3" href="/conta/login">Fazer Login</a>
        </div>

        <hr class="linha-pontilhada" />

        <p class="txt-detalhe txt-centro">
          © 2026 Vitaliza.inc All rights reserved
        </p>
      </div>
    </header>

    <main>
      <h1 class="txt-centro txt-preto">Artigos</h1>

      <hr class="linha-simples" />

      <section>
        <ul>
          <li class="link">
            <a href="/artigos/hidratacao">Importância da Hidratação;</a>
          </li>
          <li class="link">
            <a href="/artigos/alongamento"

            >
          </li>
          <li class="link">
            <a href="/artigos/exercicios">Exercícios Físicos;</a>
          </li>
          <li class="link"><a href="/artigos/suplementos">Suplementos.</a></li>
        </ul>

    <script src="/src/scripts/header.js" defer></script>
