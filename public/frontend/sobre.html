<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sobre Nós</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1 class="txt-preto">Titulo 1</h1>
    <h2>Titulo 2</h2>
    <h3>Titulo 3</h3>
    <h4>Titulo 4</h4>

    <a href="#" class="btn-1 bg-preto txt-branco">Botão 1</a>
    <a href="#" class="btn-2">Botão 2</a>

    <h3 class="txt-centro">Card</h3>

    <div class="card shadow">
      <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Assumenda
        beatae nemo quasi quia ut vel?
      </p>
      <a href="#" class="btn-1">Clique em mim</a>
    </div>

    <p class="link">Link</p>

    <form>
      <fieldset>
        <legend>Formulário</legend>

        <label for="nome">Nome:</label> <br />
        <input
          id="nome"
          name="nome"
          class="input-text"
          type="text"
          placeholder="Seu nome..."
        /><br />

        <label for="email">Email:</label> <br />
        <input
          id="email"
          class="input-text"
          type="text"
          name="email"
          placeholder="Seu email..."
        /><br />

        <label for="senha">Senha:</label> <br />
        <input
          type="password"
          id="senha"
          name="senha"
          class="input-text"
          placeholder="Sua senha..."
        /><br />

        <div class="grid-horizontal">
          <div class="grid-1">
            <label for="profissao">Profissão</label>
            <select name="profissao" id="profissao">
              <option value="1">Tipo 1</option>
              <option value="2">Tipo 2</option>
              <option value="3">Tipo 3</option>
            </select>
          </div>

          <div class="grid-1">
            <label for="departamento">Departamento</label>
            <select name="departamento" id="departamento">
              <option value="1">Tipo 1</option>
              <option value="2">Tipo 2</option>
              <option value="3">Tipo 3</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-1 bg-preto txt-branco">Enviar</button>
      </fieldset>
    </form>

    <div class="grid-horizontal">
      <div class="grid-05 grid-horizontal">
        <div class="grid-05 btn-2">Texto</div>
        <div class="grid-05 btn-2">Texto</div>
      </div>
    </div>

    <div class="direita-horizontalmente baixo-verticalmente box">
      <p>texto</p>
      <p>texto</p>
      <p>texto</p>
    </div>
  </body>
</html>
