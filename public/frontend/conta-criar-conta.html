<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/criar-conta.css" />
  </head>
  <body>
    <header>
      <img
        class="logo"
        src="src/images/Logo%202(1)%201.png"
        alt="Logo vitaliza"
      />
      <div>
        <img class="menu" src="src/images/menu.svg" alt="Menu" />
      </div>
    </header>
    <main>
      <h1 class="txt-preto">Registra-se</h1>

      <form action="/api/auth/login/email_senha" method="POST">
        <label for="email">E-mail:</label><br />
        <input
          type="email"
          id="email"
          name="email"
          required
          class="input-text"
        /><br />

        <label for="senha">Senha:</label><br />
        <input
          type="password"
          id="senha"
          name="senha"
          required
          class="input-text"
        /><br />
        <a href="" class="link">Esqueceu a senha?</a> <br />
        <a href="" class="link">Criar Conta</a> <br />

        <button type="submit" class="btn-2">Entrar</button>
      </form>

      <p class="divider">Ou</p>

      <div class="grid-horizontal centro-horizontalmente">
        <button class="grid-horizontal btn-2">
          <img src="src/images/google-svgrepo-com%201.svg" alt="Google logo" />
          <p>Google</p>
        </button>
      </div>
    </main>
  </body>
</html>
