<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/conta.css" />
  </head>
  <body>
    <main>
      <h1 class="txt-preto">Registre-se</h1>

      <form onsubmit="criarConta(event)">
        <label for="email">E-mail:</label><br />
        <input
          type="email"
          id="email"
          name="email"
          required
          class="input-text"
        /><br />

        <label for="senha">Senha:</label><br />
        <input
          type="password"
          id="senha"
          name="senha"
          required
          class="input-text"
        /><br />

        <a href="" class="link">Fazer Login</a> <br />

        <div class="grid-horizontal centro-horizontalmente">
          <button type="submit" class="btn-2">Entrar</button>
        </div>
      </form>

      <p class="divider">Ou</p>

      <div class="grid-horizontal centro-horizontalmente">
        <button class="grid-horizontal btn-2">
          <img
            src="src/images/google-svgrepo-com%201.svg"
            alt="Google logo"
            class="icon-google"
          />
          <p>Google</p>
        </button>
      </div>
    </main>
  </body>
</html>
