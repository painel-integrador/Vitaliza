<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/conta.css" />
  </head>
  <body>
    <header>
      <div class="logo-button">
        <a href="/">
          <img alt="Logo-Vitaliza" class="logo" src="/src/images/logo.svg" />
        </a>
        <img
          alt="Menu"
          class="visivel icon"
          id="botao-menu"
          onclick="menu()"
          src="/src/images/menu.svg"
        />
        <img
          alt="Fechar"
          class="invisivel icon"
          id="botao-fechar"
          onclick="menu()"
          src="/src/images/close.svg"
        />
      </div>

      <div id="nav">
        <nav class="menu">
          <a href="/"><p class="item">Início</p></a>
          <a href="/artigos"><p class="item">Artigos</p></a>
          <a href="/calculadoras"><p class="item">Calculadoras</p></a>
          <a href="/sobre"><p class="item">Sobre Nós</p></a>
          <a href="/contato"><p class="item">Entre em Contato</p></a>
          <a href="/home"><p class="item">Painel</p></a>
          <a href="/perfil" class="invisivel"><p class="item">Perfil</p></a>
          <a onclick="sair()" class="btn-2 invisivel"
            ><p class="item">Sair</p></a
          >
        </nav>

        <div class="grid-horizontal centro-horizontalmente btns" id="btns">
          <a class="btn-2" href="/conta">Criar conta</a>
          <a class="btn-3" href="/conta/login">Fazer Login</a>
        </div>

        <hr class="linha-pontilhada" />

        <p class="txt-detalhe txt-centro">
          © 2026 Vitaliza.inc All rights reserved
        </p>
      </div>
    </header>

    <main>
      <section>
        <h1 class="txt-preto txt-centro">Registre-se</h1>

        <form onsubmit="criarConta(event)" id="formulario">
          <label for="email">E-mail:</label><br />
          <input
            type="email"
            id="email"
            name="email"
            required
            class="input-text"
          /><br />

          <label for="senha">Senha:</label><br />
          <input
            type="password"
            id="senha"
            name="senha"
            required
            class="input-text"
          /><br />

          <a href="/conta/login" class="link"><p>Fazer Login</p></a> <br />

          <div class="grid-horizontal centro-horizontalmente">
            <button type="submit" class="btn-2">Criar Conta</button>
          </div>
        </form>

        <p class="divider">Ou</p>

        <div class="grid-horizontal centro-horizontalmente">
          <a href="/api/auth/google" class="grid-horizontal btn-2">
            <img
              src="/src/images/google-svgrepo-com%201.svg"
              alt="Google logo"
              class="icon-google"
            />
            <p>Google</p>
          </a>
        </div>
      </section>
    </main>

    <script src="/src/scripts/conta.js"></script>
    <script src="/src/scripts/header.js" defer></script>
  </body>
</html>
