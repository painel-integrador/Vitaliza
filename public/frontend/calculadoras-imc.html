<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Calorias</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main>
      <section>
        <!--o style deixa o titulo mais fino-->
        <h2 class="txt-preto txt-centro">Calculadora de IMC</h2>
      </section>

      <form onsubmit="calcularIMC(event)" class="grid-vertical" id="formulario">
        <label for="massa"
          >Massa em Quilos: <span class="txt-vermelho">*</span></label
        >
        <input
          type="number"
          step="0.1"
          name="massa"
          required
          class="input-text"
          placeholder="75..."
          min="1"
        />
        <label for="altura"
          >Altura em Metros: <span class="txt-vermelho">*</span></label
        >
        <input
          type="number"
          name="altura"
          step="0.01"
          required
          class="input-text"
          placeholder="1.80..."
          min="1"
        />

        <button type="submit" class="btn-3">Calcular</button>
      </form>

      <section>
        <h3>Resultado:</h3>
        <p class="txt-centro" id="resultado"></p>
      </section>

      <section class="grid-vertical">
        <img src="/src/images/tabela-imc.png" alt="Tabela IMC" />

        <div class="grid-horizontal centro-horizontalmente">
          <ul>
            <li><strong>Abaixo do normal: </strong>18,5 ou menos;</li>
            <li><strong>Normal: </strong>Entre 18,6 e 24,9;</li>
            <li><strong>Sobrepeso: </strong>Entre 25,0 e 29,9</li>
            <li><strong>Obesidade Grau I: </strong>Entre 30,0 e 34,9</li>
            <li><strong>Obesidade Grau II: </strong>Entre 35,0 e 39,9</li>
            <li><strong>Obesidade Grau III: </strong>Acima de 40,0</li>
          </ul>
        </div>
      </section>
    </main>

    <script src="/src/scripts/calculadoras.js"></script>
  </body>
</html>
