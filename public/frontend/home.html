<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="css/reset.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <title>Vitaliza</title>
  </head>
  <body>
    <header>
      <div class="logo-button">
        <img alt="Logo-Vitaliza" class="logo" src="src/images/logo.svg" />
        <img
          alt="Menu"
          class="visivel icon"
          id="botao-menu"
          onclick="menu()"
          src="src/images/menu.svg"
        />
        <img
          alt="Fechar"
          class="invisivel icon"
          id="botao-fechar"
          onclick="menu()"
          src="src/images/close.svg"
        />
      </div>

      <div class="menu-fechado" id="nav">
        <nav class="menu">
          <a class="focado shadow" href=""><p class="txt-branco">Início</p></a>
          <a href=""><p>Artigos</p></a>
          <a href=""><p>Calculadora de calorias</p></a>
        </nav>

        <div class="grid-horizontal centro-horizontalmente btns">
          <a class="btn-2" href="">Criar conta</a>
          <a class="btn-2" href="">Fazer Login</a>
        </div>

        <hr class="linha-pontilhada" />

        <p class="txt-detalhe txt-centro">
          © 2026 Vitaliza.inc All rights reserved
        </p>
      </div>
    </header>
    <main>
      <section class="banner">
        <h1>Seja a sua melhor versão</h1>
        <p>algum texto falando sobre o site ou algo do tipo</p>
        <a href="#">Veja os serviços</a>
        <a href="#">Crie sua conta</a>
      </section>
    </main>

    <script src="src/scripts/header.js"></script>
  </body>
</html>
