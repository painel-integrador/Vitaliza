<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Calorias</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main>
      <section>
        <!--o style deixa o titulo mais fino-->
        <h2 class="txt-preto txt-centro">Calculadora de Calorias</h2>
      </section>

      <form
        onsubmit="calcularCalorias(event)"
        class="grid-vertical"
        id="formulario"
      >
        <fieldset class="card grid-horizontal">
          <h4 class="txt-esquerda">
            Gênero: <span class="txt-vermelho">*</span>
          </h4>
          <br />

          <div class="grid-horizontal centro-verticalmente">
            <label class="label-menor">
              Masculino <input type="radio" name="genero" value="masculino" />
            </label>

            <label class="label-menor">
              Feminino <input type="radio" name="genero" value="feminino" />
            </label>
          </div>
        </fieldset>

        <label for="idade">Idade: <span class="txt-vermelho">*</span></label>
        <input
          type="number"
          name="idade"
          required
          class="input-text"
          placeholder="16..."
          max="120"
          min="1"
        />

        <label for="massa"
          >Massa em Kg: <span class="txt-vermelho">*</span></label
        >
        <input
          type="number"
          name="massa"
          required
          class="input-text"
          placeholder="75..."
          min="1"
          step="0.1"
        />

        <label for="altura"
          >Altura em Metros: <span class="txt-vermelho">*</span></label
        >
        <input
          type="number"
          name="altura"
          step="0.01"
          required
          class="input-text"
          placeholder="1.80..."
          min="1"
        />

        <label for="atividade"
          >Atividade física <span class="txt-vermelho">*</span></label
        >
        <select name="atividade" id="atividade" required>
          <option value="sedentario">
            Sedentário (pouco ou nenhum exercício)
          </option>
          <option value="levemente">
            Levemente ativo (exercício leve 1 a 3 vezes por semana)
          </option>
          <option value="moderado">
            Moderadamente ativo (exercício moderado 3 a 5 vezes por semana)
          </option>
          <option value="muito">
            Muito ativo (exercício pesado 6 a 7 vezes por semana)
          </option>
          <option value="extremo">
            Extremamente ativo (trabalho físico pesadíssimo ou treino diário
            intenso)
          </option>
        </select>

        <button type="submit" class="btn-3">Calcular</button>
      </form>

      <section>
        <h3>Resultado:</h3>
        <p id="resultado"></p>
      </section>
    </main>

    <script src="/src/scripts/calculadoras.js"></script>
  </body>
</html>
